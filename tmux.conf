# -------------------------------------------------------------------
# 1. 기본 설정 & 반응 속도 최적화
# -------------------------------------------------------------------
# Vim/Emacs ESC 키 지연 시간 제거 (0ms)
set -s escape-time 0

# 외부 포커스 이벤트 전달 활성화 (에디터 자동 저장/리로드 지원)
set -g focus-events on

# 역사적인 스크롤 제한 늘리기 (기본 2000라인 -> 50000라인)
set -g history-limit 50000

# 설정 파일 실시간 새로고침 단축키 (Prefix + r)
bind r source-file ~/.tmux.conf \; display "tmux config reloaded!"

# -------------------------------------------------------------------
# 2. 마우스 및 터미널 색상 설정
# -------------------------------------------------------------------
# 마우스 스크롤, 창 크기 조절, 패널 선택 활성화
set -g mouse on

# Vim 색상 깨짐 방지 및 true color(256색), UTF-8 와이드 문자 최적화
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"

# 인덱스 시작 번호를 0 대신 1로 설정 (키보드 숫자 배열 맞춤)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on # 창이 닫히면 번호 재정렬

# -------------------------------------------------------------------
# 3. 창(Window) 및 패널(Pane) 분할 & 탐색 직관화
# -------------------------------------------------------------------
# 새 창(Window) 생성 시에도 현재 경로 유지
bind c new-window -c "#{pane_current_path}"

# 현재 경로를 유지하면서 패널 분할 (직관적인 기호 사용)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim 스타일 키(h, j, k, l)로 패널 간 이동
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 패널 크기 조절 (Prefix + Shift + h/j/k/l, 연속 입력 가능 -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 창(Window) 간 빠른 이동 (Prefix + Ctrl + h / l)
bind -r C-h previous-window
bind -r C-l next-window

# -------------------------------------------------------------------
# 4. macOS 클립보드 복사 시스템 연동 & 마우스 선택 설정
# -------------------------------------------------------------------
# 카피 모드 진입 시 Vim 단축키(vi) 체계 사용
setw -g mode-keys vi

# 선택 영역(셀렉션) 가독성 극대화 (눈에 잘 띄는 노란색 배경 + 볼드)
set -g mode-style "bg=#f9e2af,fg=#1e1e2e,bold"

# 카피 모드(Prefix + [) 안에서 v는 선택, y는 macOS 클립보드로 복사
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# 마우스 드래그 종료 시 macOS 클립보드로 자동 복사 후 셀렉션 닫기
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# 더블 클릭: 단어 선택 -> 0.5초 동안 셀렉션 표시 -> macOS 클립보드 복사 후 셀렉션 닫기
bind-key -T root DoubleClick1Pane \
    select-pane -t = \; \
    if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
        { send-keys -M } \
        { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.5 ; send-keys -X copy-pipe-and-cancel "pbcopy" }

bind-key -T copy-mode-vi DoubleClick1Pane \
    select-pane \; \
    send-keys -X select-word \; \
    run-shell -d 0.5 \; \
    send-keys -X copy-pipe-and-cancel "pbcopy"

# 삼중 클릭: 전체 줄 선택 -> 0.5초 동안 셀렉션 표시 -> macOS 클립보드 복사 후 셀렉션 닫기
bind-key -T root TripleClick1Pane \
    select-pane -t = \; \
    if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
        { send-keys -M } \
        { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.5 ; send-keys -X copy-pipe-and-cancel "pbcopy" }

bind-key -T copy-mode-vi TripleClick1Pane \
    select-pane \; \
    send-keys -X select-line \; \
    run-shell -d 0.5 \; \
    send-keys -X copy-pipe-and-cancel "pbcopy"


# -------------------------------------------------------------------
# 5. 상태 표시줄(Status Bar) 모던 테마
# -------------------------------------------------------------------
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# 왼쪽: 세션 이름
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=#1e1e2e,fg=#89b4fa] "

# 오른쪽: 날짜 및 시각
set -g status-right-length 50
set -g status-right "#[fg=#a6adc8] %Y-%m-%d #[fg=#89b4fa,bold]%H:%M "

# 창 탭 스타일
setw -g window-status-format "#[fg=#6c7086,bg=#1e1e2e] #I:#W "
setw -g window-status-current-format "#[fg=#11111b,bg=#a6e3a1,bold] #I:#W #[fg=#a6e3a1,bg=#1e1e2e]"

# 패널 테두리 색상
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

