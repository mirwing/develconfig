# -------------------------------------------------------------------
# 1. 기본 설정
# -------------------------------------------------------------------
# 역사적인 스크롤 제한 늘리기 (기본 2000라인 -> 50000라인)
set -g history-limit 50000

# 설정 파일 실시간 새로고침 단축키 (Prefix + r)
bind r source-file ~/.tmux.conf \; display "Tmux Config Reloaded!"

# -------------------------------------------------------------------
# 2. 마우스 및 터미널 색상 설정
# -------------------------------------------------------------------
# 마우스 스크롤, 창 크기 조절, 패널 선택 활성화
set -g mouse on

# Vim 색상 깨짐 방지 및 true color(256색) 활성화
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# 인덱스 시작 번호를 0 대신 1로 설정 (키보드 숫자 배열 맞춤)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on # 창이 닫히면 번호 재정렬

# -------------------------------------------------------------------
# 3. 창(Window) 및 패널(Pane) 분할 직관화
# -------------------------------------------------------------------
# 현재 경로를 유지하면서 패널 분할 (직관적인 기호 사용)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim 스타일 키(h, j, k, l)로 패널 간 이동
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -------------------------------------------------------------------
# 4. macOS 클립보드 복사 시스템 연동 (Vim 모드)
# -------------------------------------------------------------------
# 카피 모드 진입 시 Vim 단축키(vi) 체계 사용
setw -g mode-keys vi

# 카피 모드(Prefix + [) 안에서 v는 선택, y는 macOS 클립보드로 복사
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# 마우스 드래그 종료 시 macOS 클립보드로 자동 복사 (선택 해제 안 됨)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

